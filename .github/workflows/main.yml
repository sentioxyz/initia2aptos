name: Node.js CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.publish.outputs.version }}
    permissions:
      id-token: write
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '26' # Specify your Node.js version
        registry-url: 'https://registry.npmjs.org/'

    - name: Install pnpm
      run: npm install -g pnpm

    - name: Install dependencies
      run: pnpm install

    - name: Build
      run: pnpm run build

    - name: Run tests
      run: pnpm test

    - name: Publish to npm
      id: publish
      if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      run: |
        version=$(node -p "require('./package.json').version")
        dist_tag=latest
        if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
          version="$version-rc.$GITHUB_RUN_NUMBER"
          dist_tag=rc
        fi
        pnpm pkg set version="$version"
        pnpm publish --tag "$dist_tag" --no-git-checks
        echo "version=$version" >> "$GITHUB_OUTPUT"

  docker:
    runs-on: ubuntu-latest
    needs: test-and-build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ghcr.io/sentioxyz/initial-aptos:latest
          ghcr.io/sentioxyz/initial-aptos:${{ needs.test-and-build.outputs.version }}
